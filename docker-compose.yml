version: '3.8'

services:
  nhl-proxy:
    build: .
    container_name: nhl-proxy
    ports:
      - "5000:5000"
    restart: unless-stopped
    environment:
      - TZ=America/Denver
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    labels:
      - "net.unraid.docker.managed=composeman"
      - "net.unraid.docker.icon=https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/nhl.png"
